name: efcore
runtime: dotnet
support:
  bootstrap: unsupported
  deep: experimental
detect:
  files:
    - "*.csproj"
  dependencies:
    - Microsoft.EntityFrameworkCore
entrypoint:
  patterns:
    - Program.cs
inject:
  bootstrap:
    file: ObservabilityExtensions.cs
  database:
    target: EntityFrameworkCore
metrics:
  db_latency: true
  db_pool: true
verify:
  request_path: /health
