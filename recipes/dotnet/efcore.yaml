name: efcore
runtime: dotnet
support:
  bootstrap: stable
  deep: experimental
detect:
  files:
    - "*.csproj"
    - "*.sln"
    - "*.slnx"
    - "*.slnf"
  dependencies:
    - Microsoft.EntityFrameworkCore
entrypoint:
  patterns:
    - Program.cs
inject:
  bootstrap:
    file: ExtentObservabilityExtensions.cs
  database:
    target: EntityFrameworkCore
metrics:
  db_latency: true
  db_pool: true
verify:
  request_path: /health
