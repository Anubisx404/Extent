name: aspnetcore
runtime: dotnet
support:
  bootstrap: stable
  deep: experimental
detect:
  files:
    - "*.csproj"
    - "*.sln"
    - "*.slnx"
    - "*.slnf"
  dependencies:
    - Microsoft.AspNetCore
entrypoint:
  patterns:
    - Program.cs
inject:
  bootstrap:
    file: ExtentObservabilityExtensions.cs
  middleware:
    target: WebApplication
  logger:
    supported:
      - serilog
      - ILogger
metrics:
  http_red: true
  runtime: true
verify:
  request_path: /health
