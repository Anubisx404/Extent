name: nestjs
runtime: node
detect:
  files:
    - package.json
  dependencies:
    - "@nestjs/core"
entrypoint:
  patterns:
    - src/main.ts
inject:
  bootstrap:
    file: extent.instrumentation.js
  middleware:
    target: app.use
  logger:
    supported:
      - pino
      - winston
metrics:
  http_red: true
  runtime: true
verify:
  request_path: /health
