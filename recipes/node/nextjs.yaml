name: nextjs
runtime: node
detect:
  files:
    - package.json
  dependencies:
    - next
entrypoint:
  patterns:
    - instrumentation.ts
    - instrumentation.js
inject:
  bootstrap:
    file: extent.instrumentation.js
  logger:
    supported:
      - pino
      - winston
metrics:
  http_red: true
  runtime: true
verify:
  request_path: /
