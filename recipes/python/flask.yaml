name: flask
runtime: python
support:
  bootstrap: stable
  deep: experimental
detect:
  files:
    - requirements.txt
    - pyproject.toml
  dependencies:
    - flask
entrypoint:
  patterns:
    - app.py
    - main.py
inject:
  bootstrap:
    file: extent_instrumentation.py
  middleware:
    target: Flask
  logger:
    supported:
      - logging
      - structlog
metrics:
  http_red: true
  runtime: true
verify:
  request_path: /health
