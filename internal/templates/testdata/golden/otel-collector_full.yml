exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  prometheus:
    endpoint: 0.0.0.0:9464
    resource_to_telemetry_conversion:
      enabled: true
processors:
  attributes/redact:
    actions:
      - action: delete
        key: http.request.header.authorization
      - action: delete
        key: http.request.header.cookie
  batch: null
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  resource:
    attributes:
      - action: insert
        key: deployment.environment
        value: development
      - action: upsert
        key: telemetry.sdk.managed_by
        value: extent
  resource/metrics_cardinality:
    attributes:
      - action: delete
        key: process.pid
      - action: delete
        key: process.command_args
      - action: delete
        key: process.command
      - action: delete
        key: process.command_line
      - action: delete
        key: process.executable.path
      - action: delete
        key: process.executable.name
      - action: delete
        key: process.owner
      - action: delete
        key: process.runtime.description
      - action: delete
        key: host.id
      - action: delete
        key: host.name
      - action: delete
        key: service.instance.id
  tail_sampling:
    decision_wait: 5s
    expected_new_traces_per_sec: 100
    num_traces: 50000
    policies:
      - name: keep-correlation-request
        ottl_condition:
          error_mode: ignore
          span:
            - attributes["http.request.header.x_request_id"] != nil
        type: ottl_condition
      - name: keep-errors
        status_code:
          status_codes:
            - ERROR
        type: status_code
      - latency:
          threshold_ms: 500
        name: keep-slow
        type: latency
      - name: baseline-10pct
        probabilistic:
          sampling_percentage: 10
        type: probabilistic
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
service:
  pipelines:
    logs:
      exporters:
        - otlphttp/loki
      processors:
        - memory_limiter
        - resource
        - attributes/redact
        - batch
      receivers:
        - otlp
    metrics:
      exporters:
        - prometheus
      processors:
        - memory_limiter
        - resource
        - resource/metrics_cardinality
        - attributes/redact
        - batch
      receivers:
        - otlp
    traces:
      exporters:
        - otlp/tempo
      processors:
        - memory_limiter
        - resource
        - attributes/redact
        - tail_sampling
        - batch
      receivers:
        - otlp
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
