exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:9464
    resource_to_telemetry_conversion:
      enabled: true
processors:
  batch: null
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  resource:
    attributes:
      - action: insert
        key: deployment.environment
        value: development
      - action: upsert
        key: telemetry.sdk.managed_by
        value: extent
  resource/metrics_cardinality:
    attributes:
      - action: delete
        key: process.pid
      - action: delete
        key: process.command_args
      - action: delete
        key: process.command
      - action: delete
        key: process.command_line
      - action: delete
        key: process.executable.path
      - action: delete
        key: process.executable.name
      - action: delete
        key: process.owner
      - action: delete
        key: process.runtime.description
      - action: delete
        key: host.id
      - action: delete
        key: host.name
      - action: delete
        key: service.instance.id
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
service:
  pipelines:
    metrics:
      exporters:
        - prometheus
      processors:
        - memory_limiter
        - resource
        - resource/metrics_cardinality
        - batch
      receivers:
        - otlp
    traces:
      exporters:
        - otlp/tempo
      processors:
        - memory_limiter
        - resource
        - batch
      receivers:
        - otlp
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
