global:
  scrape_interval: 5s
rule_files:
  - /etc/prometheus/prometheus-alerts.yml
scrape_configs:
  - job_name: otel-collector-internal
    static_configs:
      - targets:
          - otel-collector:8888
  - job_name: otlp-metrics
    static_configs:
      - targets:
          - otel-collector:9464
